[project]
name = "bag-assistant-api"
version = "0.1.0"
description = "FastAPI-сервис для LLM диплома (BAG_ASSISTANT)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "asyncpg>=0.29",
    "arize-phoenix>=4.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=1.40",
    "openinference-instrumentation-openai>=0.1.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"